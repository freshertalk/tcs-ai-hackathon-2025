<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DrishtiAI">
  <!-- DrishtiAI: the sun's eye. An eye (drishti = sight) inside a sun of twelve rays, whose pupil is a rising price path:
       ruby, copper and gold, with a warm sandal light. One file, used everywhere in the trading area. -->
  <defs>
    <radialGradient id="dr-bg" cx="34%" cy="26%" r="92%">
      <stop offset="0" stop-color="#a8323d"/>
      <stop offset="0.55" stop-color="#7a1f2b"/>
      <stop offset="1" stop-color="#4c111b"/>
    </radialGradient>
    <linearGradient id="dr-gold" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe3a0"/>
      <stop offset="0.5" stop-color="#e9b44c"/>
      <stop offset="1" stop-color="#c8962e"/>
    </linearGradient>
    <radialGradient id="dr-iris" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#d9772f"/>
      <stop offset="1" stop-color="#8a3c08"/>
    </radialGradient>
    <clipPath id="dr-eye"><path d="M10.4 32C18 18.6 46 18.6 53.6 32 46 45.4 18 45.4 10.4 32Z"/></clipPath>
  </defs>
  <circle cx="32" cy="32" r="32" fill="url(#dr-bg)"/>
  <circle cx="32" cy="32" r="30.9" fill="none" stroke="url(#dr-gold)" stroke-width="2.2"/>
  <!-- the sun's twelve rays -->
  <path d="M53.42 36.05L60.01 39.51L52.58 39.2Q52.19 37.41 53.42 36.05ZM48.53 46.22L51.09 51.09L46.22 48.53Q46.78 46.78 48.53 46.22ZM39.2 52.58L39.51 60.01L36.05 53.42Q37.41 52.19 39.2 52.58ZM27.95 53.42L25.01 58.08L24.8 52.58Q26.59 52.19 27.95 53.42ZM17.78 48.53L11.49 52.51L15.47 46.22Q17.22 46.78 17.78 48.53ZM11.42 39.2L5.92 38.99L10.58 36.05Q11.81 37.41 11.42 39.2ZM10.58 27.95L3.99 24.49L11.42 24.8Q11.81 26.59 10.58 27.95ZM15.47 17.78L12.91 12.91L17.78 15.47Q17.22 17.22 15.47 17.78ZM24.8 11.42L24.49 3.99L27.95 10.58Q26.59 11.81 24.8 11.42ZM36.05 10.58L38.99 5.92L39.2 11.42Q37.41 11.81 36.05 10.58ZM46.22 15.47L52.51 11.49L48.53 17.78Q46.78 17.22 46.22 15.47ZM52.58 24.8L58.08 25.01L53.42 27.95Q52.19 26.59 52.58 24.8Z" fill="url(#dr-gold)" stroke="url(#dr-gold)" stroke-width="0.5" stroke-linejoin="round"/>
  <!-- the eye -->
  <path d="M10.4 32C18 18.6 46 18.6 53.6 32 46 45.4 18 45.4 10.4 32Z" fill="#3a0a12"/>
  <g clip-path="url(#dr-eye)">
    <circle cx="32" cy="32" r="11" fill="url(#dr-iris)"/>
    <circle cx="32" cy="32" r="11" fill="none" stroke="#ffd98a" stroke-opacity="0.75" stroke-width="1.1"/>
  </g>
  <path d="M10.4 32C18 18.6 46 18.6 53.6 32 46 45.4 18 45.4 10.4 32Z" fill="none" stroke="url(#dr-gold)" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- what it sees: the price, turning up -->
  <path d="M25.6 37 30 31.9 33.1 34.5 37.4 29.1" fill="none" stroke="#fff3d6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M35.2 27.6 39.6 26.8 39.1 31.3Z" fill="#fff3d6" stroke="#fff3d6" stroke-width="0.9" stroke-linejoin="round"/>
</svg>
