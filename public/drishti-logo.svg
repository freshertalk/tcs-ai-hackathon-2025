<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DrishtiAI">
  <!-- DrishtiAI: an eye (drishti = sight) whose pupil is a rising price path. One file, used everywhere in the trading area. -->
  <defs>
    <radialGradient id="dr-bg" cx="30%" cy="22%" r="95%">
      <stop offset="0" stop-color="#1f4a86"/>
      <stop offset="0.55" stop-color="#0f2550"/>
      <stop offset="1" stop-color="#081228"/>
    </radialGradient>
    <linearGradient id="dr-lid" x1="5" y1="18" x2="59" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#63e6d2"/>
      <stop offset="1" stop-color="#6aaeee"/>
    </linearGradient>
    <linearGradient id="dr-path" x1="22" y1="40" x2="43" y2="23" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="1" stop-color="#ff9a3d"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="32" fill="url(#dr-bg)"/>
  <circle cx="32" cy="32" r="31.1" fill="none" stroke="#7fb8f5" stroke-opacity="0.38" stroke-width="1.6"/>
  <!-- the eye -->
  <path d="M5.6 32C14 14.6 50 14.6 58.4 32 50 49.4 14 49.4 5.6 32Z" fill="#0a1a3a" stroke="url(#dr-lid)" stroke-width="3.3" stroke-linejoin="round"/>
  <!-- the iris -->
  <circle cx="32" cy="32" r="12.4" fill="#123466" stroke="#9ccdff" stroke-opacity="0.6" stroke-width="1.5"/>
  <!-- what it sees: the price, turning up -->
  <path d="M23.2 38.4 29 31.5 33.5 35.2 40.3 26.1" fill="none" stroke="url(#dr-path)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M35.9 24.7 42.2 24.2 41.8 30.5Z" fill="#ff9a3d" stroke="#ff9a3d" stroke-width="1.4" stroke-linejoin="round"/>
</svg>
