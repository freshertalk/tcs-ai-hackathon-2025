        <h1>दो कुल्हड़ चाय — विनय कुमार तिवारी का हिन्दी उपन्यास</h1>
        <p lang="hi">
          <strong>दो कुल्हड़ चाय</strong> (Do Kulhad Chai) <strong>विनय कुमार तिवारी</strong>
          (Vinay Kumar Tiwari, Vinay Tiwari) का पहला हिन्दी उपन्यास है। एक आदमी है, जो हर महीने की बारह तारीख़ को एक ट्रेन में चढ़ता है।
          वह हर बार दो टिकट लेता है। और वह हमेशा अकेला सफ़र करता है। यह किताब यह बताने
          के लिए लिखी गई है कि दूसरा टिकट किसका है। 12 जुलाई 2015 की रात शिवगंगा
          एक्सप्रेस (नई दिल्ली से बनारस) कानपुर आउटर पर साढ़े चार घंटे एक लाल सिग्नल के
          सामने खड़ी रह जाती है; सीट 33 और 36 पर बैठे दो अजनबी पूरी रात बात करते हैं, और
          नाम सबसे आख़िर में पूछते हैं।
        </p>
