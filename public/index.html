        <h1>Vinay Kumar Tiwari — SAP BTP Solution Architect &amp; Hindi Author</h1>
        <p>
          <strong>Vinay Kumar Tiwari</strong> (also written <strong>Vinay Tiwari</strong>,
          <strong>विनय कुमार तिवारी</strong>) grew up in Ghazipur, Uttar Pradesh, and lives
          in Noida, India. He is an SAP BTP Solution Architect with 11+ years of
          enterprise delivery experience across IBM, TCS, Cognizant, Mindtree and Wipro
          &mdash; and, by night, a Hindi author.
        </p>

        <h2>Engineering</h2>
        <p>
          Specialises in the SAP Business Technology Platform: SAP CAP (CAPM), SAP Fiori
          and SAPUI5, SAP HANA Cloud, SAP Build, Business Application Studio, WorkZone,
          Event Mesh, Integration Suite, Cloud Foundry, OData V2/V4 and Clean Core
          extensibility for S/4HANA &mdash; with AI-assisted engineering (SAP AI Core, SAP Joule,
          GitHub Copilot, Claude Code) built into delivery.
        </p>
        <p>
          SAP certified: SAP Certified Development Associate &mdash; SAP Fiori Application
          Developer (C_FIORDEV_21) and SAP Extension Suite (C_CPE_12). Education:
          PG-DAC, C-DAC Pune; B.E. Electronics &amp; Communication Engineering, RGPV Bhopal.
        </p>
        <p>
          Founder of <a href="https://btplearninghub.com">BTP Learning Hub</a> &mdash; free,
          ad-free SAP BTP tutorials and architecture walkthroughs.
        </p>

        <h2>एक लेखक के रूप में विनय</h2>
        <p lang="hi">
          विनय कुमार तिवारी ग़ाज़ीपुर, उत्तर प्रदेश में पले-बढ़े और आजकल नोएडा में रहते हैं।
          इंजीनियरिंग (B.E.) के बाद से वे सॉफ़्टवेयर इंजीनियर हैं &mdash; बड़े सिस्टम सोचते, उनका
          ढाँचा खड़ा करते और उन्हें बनाते हैं। उनकी ज़िद एक ही है: जो बने, उसमें कोई कमी न रहे।
        </p>
        <p lang="hi">
          दिन में वे ऐसी दुनिया बनाते हैं जहाँ हर ग़लती पकड़ी जाती है और ठीक कर दी जाती है। रात
          में वे उस दुनिया के बारे में लिखते हैं जहाँ ऐसा नहीं होता।
        </p>
        <p>

        </p>
