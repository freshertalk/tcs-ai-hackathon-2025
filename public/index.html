        <h1>Vinay Kumar Tiwari — SAP BTP Solution Architect &amp; Hindi Author</h1>
        <p>
          <strong>Vinay Kumar Tiwari</strong> (also written <strong>Vinay Tiwari</strong>,
          <strong>विनय कुमार तिवारी</strong>) is an SAP BTP Solution Architect based in
          Noida, India, originally from Ghazipur, Uttar Pradesh. He has 11+ years of
          enterprise delivery experience across IBM, TCS, Cognizant, Mindtree and Wipro.
        </p>

        <h2>Technical portfolio</h2>
        <p>
          Specialises in the SAP Business Technology Platform: SAP CAP (CAPM), SAP Fiori
          and SAPUI5, SAP HANA Cloud, SAP Build, Business Application Studio, WorkZone,
          Event Mesh, Integration Suite, Cloud Foundry, OData V2/V4 and Clean Core
          extensibility for S/4HANA — with AI-assisted engineering (SAP AI Core, SAP Joule,
          GitHub Copilot, Claude Code) built into delivery.
        </p>
        <p>
          SAP certified: SAP Certified Development Associate — SAP Fiori Application
          Developer (C_FIORDEV_21) and SAP Extension Suite (C_CPE_12). Education:
          PG-DAC, C-DAC Pune; B.E. Electronics &amp; Communication Engineering.
        </p>
        <p>
          Founder of <a href="https://btplearninghub.com">BTP Learning Hub</a> — free,
          ad-free SAP BTP tutorials and architecture walkthroughs.
        </p>

        <h2>दो कुल्हड़ चाय (Do Kulhad Chai) — हिन्दी उपन्यास</h2>
        <p lang="hi">
          दो कुल्हड़ चाय विनय कुमार तिवारी का पहला हिन्दी उपन्यास है। एक ट्रेन साढ़े चार घंटे
          खड़ी रह जाए, तो उसमें बैठे दो अजनबियों के पास सिर्फ़ दो चीज़ें बचती हैं — बारिश और
          बातचीत। शिवगंगा एक्सप्रेस, सीट छत्तीस और सैंतीस, और हर महीने की बारह तारीख़ का एक
          वादा। कहानी कानपुर आउटर से लखनऊ जंक्शन होते हुए बनारस तक जाती है।
        </p>
        <p>

        </p>
