# An example for the server that hosts the site (nginx).
#
# public/_headers and public/_redirects are written for Netlify / Cloudflare
# Pages; nginx ignores them, so the same rules are written out here. Adapt the
# paths and the certificate lines to your server — this is a starting point,
# not something to paste over a working file without reading it.
#
# After editing:   sudo nginx -t && sudo systemctl reload nginx
# After uploading: node scripts/verify-deploy.js https://vinaytiwari.org

# One address for sign-in: www goes to the plain address. (Each address is a
# separate "origin" for Google sign-in and for the reader's saved place, so a
# person who arrives on www would otherwise sign in twice.)
server {
    listen 443 ssl http2;
    server_name www.vinaytiwari.org;
    # ssl_certificate     ...;
    # ssl_certificate_key ...;
    return 301 https://vinaytiwari.org$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vinaytiwari.org;
    # ssl_certificate     ...;
    # ssl_certificate_key ...;

    root  /var/www/vinaytiwari.org;     # where the contents of build/ are uploaded
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

    # The book needs a secure page (it decrypts in the browser) — keep HTTPS.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    # If you add a Content-Security-Policy, the payment window needs:
    #   script-src  https://checkout.razorpay.com
    #   frame-src   https://api.razorpay.com https://checkout.razorpay.com
    #   connect-src https://api.razorpay.com https://lumberjack.razorpay.com
    # (plus Google's, for sign-in, and script.google.com for the collector).

    # Retired addresses (public/_redirects)
    location = /technical { return 301 /; }
    location = /writings  { return 301 /; }

    # The page that names the current scripts: never keep it. Without this a
    # browser may show yesterday's page for days after an upload.
    # (add_header in a location replaces the ones above, so they are repeated.)
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Hashed build files never change under the same name.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Books: ask the server whether a file changed (a cheap 304). A missing
    # chapter is a real 404, never the home page.
    location /content/ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # The reader's own shell (written by scripts/prerender.js)
    location /read/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri /read/index.html;
    }

    # Everything else is the single-page app.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
